<!doctype html><html><head><meta charset="utf-8"><title>UNG-NAVSTAR</title>
<style>html,body{margin:0;height:100%;background:#030711;color:#dbe8ff;font:14px system-ui}header{height:54px;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid #26344d}.modes button{background:#0b1425;color:#bcd0f2;border:1px solid #273a5c;padding:7px 10px}.modes .on{border-color:#8eb9ff;color:white}main{display:grid;grid-template-columns:1fr 330px;height:calc(100% - 55px)}#scene{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#122449 0,#07101f 36%,#02040a 72%)}#earth{position:absolute;width:180px;height:180px;border-radius:50%;left:46%;top:40%;background:radial-gradient(circle at 35% 30%,#9cd9ff,#2365b8 35%,#092044 67%,#020711 72%);box-shadow:0 0 50px #2a67b7}.boundary{position:absolute;border:1px solid #75aaff;border-left:4px solid #75aaff;border-radius:50%;opacity:.45}.mp{width:410px;height:310px;left:37%;top:31%}.bs{width:560px;height:410px;left:30%;top:25%}.tail{position:absolute;left:7%;top:44%;width:40%;height:100px;border-top:1px solid #6c8fc8;border-bottom:1px solid #6c8fc8;transform:perspective(400px) rotateY(-8deg);opacity:.4}.sun{position:absolute;right:5%;top:12%;font-size:55px;text-shadow:0 0 30px #fff}.wind{position:absolute;right:13%;top:48%;font-size:30px;letter-spacing:15px}.panel{border-left:1px solid #26344d;padding:16px;overflow:auto}.card{border:1px solid #243652;background:#08101e;margin:10px 0;padding:12px}.ok{color:#8cffbd}small{color:#8297b9}.layer{display:inline-block;margin:3px;padding:5px 7px;background:#0b1425;color:#bcd0f2;border:1px solid #273a5c;border-radius:4px;font-size:11px}.layer.on{border-color:#8eb9ff;color:white}.node{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff}.strand{position:absolute;height:1px;background:#54efb1;transform-origin:0 0;opacity:.65;box-shadow:0 0 8px #54efb1}</style></head>
<body><header><b>UNG-NAVSTAR</b><span>SPACE DIGITAL TWIN</span><div class="modes" id="modes"></div></header><main><section id="scene"><div class="tail"></div><div class="boundary bs"></div><div class="boundary mp"></div><div id="earth"></div><div class="sun">☼</div><div class="wind">← ← ←</div></section><aside class="panel"><b>OPERATIONS</b><div class="card"><span class="ok">● LIVE</span><br><small id="clock"></small></div><div class="card"><b>Digital Twin</b><pre id="state">Connecting…</pre></div><div class="card"><b>Analysis Layers</b><div id="layers"></div><pre id="analysis">Select a layer</pre></div><div class="card"><b>Provenance</b><br>MEASURED · DERIVED · ASSIMILATED<br>MODELED · FORECAST · SIMULATED</div></aside></main>
<script>const names=['LIVE','FORECAST','NAV','COMMS','MISSION','SIM LAB','REPLAY'];const m=document.querySelector('#modes');names.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.className=i?'':'on';b.onclick=()=>{[...m.children].forEach(q=>q.className='');b.className='on'};m.appendChild(b)});setInterval(()=>clock.textContent=new Date().toISOString(),1000);const proto=location.protocol==='https:'?'wss':'ws';let ws=new WebSocket(proto+'://'+location.host+'/api/v1/twin/stream');ws.onmessage=e=>state.textContent=JSON.stringify(JSON.parse(e.data),null,2).slice(0,1600);
const layerNames=['relationship-graph','magnetic-connectivity','lineage','uncertainty-heatmap','forecast-ghosts','correlations','coverage-shells','sensor-fusion','spacecraft-bubble','proximity','route-risk','comms-mesh','resilience','twin-difference','model-battle','anomaly-constellations','explain','bookmark','mission-record','search'];
const layerBox=document.querySelector('#layers'),analysis=document.querySelector('#analysis'),scene=document.querySelector('#scene');
function networkDemo(){scene.querySelectorAll('.node,.strand').forEach(x=>x.remove());const pts=Array.from({length:26},(_,i)=>({x:18+Math.random()*64,y:18+Math.random()*64}));pts.forEach(p=>{let n=document.createElement('i');n.className='node';n.style.left=p.x+'%';n.style.top=p.y+'%';scene.appendChild(n)});for(let i=0;i<36;i++){let a=pts[Math.floor(Math.random()*pts.length)],b=pts[Math.floor(Math.random()*pts.length)],dx=(b.x-a.x)*scene.clientWidth/100,dy=(b.y-a.y)*scene.clientHeight/100,l=document.createElement('i');l.className='strand';l.style.left=a.x+'%';l.style.top=a.y+'%';l.style.width=Math.hypot(dx,dy)+'px';l.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';scene.appendChild(l)}}
layerNames.forEach(name=>{let b=document.createElement('button');b.className='layer';b.textContent=name.replaceAll('-',' ');b.onclick=async()=>{[...layerBox.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');if(name==='relationship-graph')networkDemo();let payload=name==='relationship-graph'?{nodes:[{id:'CONSTELLATION'},{id:'NAVSTAR'},{id:'ORION'}],edges:[{a:'CONSTELLATION',b:'NAVSTAR'},{a:'NAVSTAR',b:'ORION'}]}:{};try{let r=await fetch('/api/v1/analysis/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});analysis.textContent=JSON.stringify(await r.json(),null,2).slice(0,1800)}catch(e){analysis.textContent=String(e)}};layerBox.appendChild(b)});
</script></body></html>
