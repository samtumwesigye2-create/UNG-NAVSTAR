<!doctype html><html><head><meta charset="utf-8"><title>UNG-NAVSTAR</title>
<style>html,body{margin:0;height:100%;background:#030711;color:#dbe8ff;font:14px system-ui}header{height:54px;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid #26344d}.modes button{background:#0b1425;color:#bcd0f2;border:1px solid #273a5c;padding:7px 10px}.modes .on{border-color:#8eb9ff;color:white}main{display:grid;grid-template-columns:1fr 330px;height:calc(100% - 55px)}#scene{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#122449 0,#07101f 36%,#02040a 72%)}#earth{position:absolute;width:180px;height:180px;border-radius:50%;left:46%;top:40%;background:radial-gradient(circle at 35% 30%,#9cd9ff,#2365b8 35%,#092044 67%,#020711 72%);box-shadow:0 0 50px #2a67b7}.boundary{position:absolute;border:1px solid #75aaff;border-left:4px solid #75aaff;border-radius:50%;opacity:.45}.mp{width:410px;height:310px;left:37%;top:31%}.bs{width:560px;height:410px;left:30%;top:25%}.tail{position:absolute;left:7%;top:44%;width:40%;height:100px;border-top:1px solid #6c8fc8;border-bottom:1px solid #6c8fc8;transform:perspective(400px) rotateY(-8deg);opacity:.4}.sun{position:absolute;right:5%;top:12%;font-size:55px;text-shadow:0 0 30px #fff}.wind{position:absolute;right:13%;top:48%;font-size:30px;letter-spacing:15px}.panel{border-left:1px solid #26344d;padding:16px;overflow:auto}.card{border:1px solid #243652;background:#08101e;margin:10px 0;padding:12px}.ok{color:#8cffbd}small{color:#8297b9}</style></head>
<body><header><b>UNG-NAVSTAR</b><span>SPACE DIGITAL TWIN</span><div class="modes" id="modes"></div></header><main><section id="scene"><div class="tail"></div><div class="boundary bs"></div><div class="boundary mp"></div><div id="earth"></div><div class="sun">☼</div><div class="wind">← ← ←</div></section><aside class="panel"><b>OPERATIONS</b><div class="card"><span class="ok">● LIVE</span><br><small id="clock"></small></div><div class="card"><b>Digital Twin</b><pre id="state">Connecting…</pre></div><div class="card"><b>Provenance</b><br>MEASURED · DERIVED · ASSIMILATED<br>MODELED · FORECAST · SIMULATED</div></aside></main>
<script>const names=['LIVE','FORECAST','NAV','COMMS','MISSION','SIM LAB','REPLAY'];const m=document.querySelector('#modes');names.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.className=i?'':'on';b.onclick=()=>{[...m.children].forEach(q=>q.className='');b.className='on'};m.appendChild(b)});setInterval(()=>clock.textContent=new Date().toISOString(),1000);const proto=location.protocol==='https:'?'wss':'ws';let ws=new WebSocket(proto+'://'+location.host+'/api/v1/twin/stream');ws.onmessage=e=>state.textContent=JSON.stringify(JSON.parse(e.data),null,2).slice(0,1600);</script></body></html>
