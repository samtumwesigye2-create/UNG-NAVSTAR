<!doctype html><html><head><meta charset="utf-8"><title>NAVSTAR 3D</title><style>html,body,#c{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#hud{position:fixed;z-index:2;left:16px;top:16px;color:#dbe9ff;font:12px system-ui;background:#07101dcc;padding:12px;border:1px solid #294467;border-radius:8px}b{color:#fff}.navhud{position:fixed;right:12px;top:12px;z-index:5;background:#071018dd;border:1px solid #24485c;border-radius:10px;padding:10px;width:min(310px,42vw);font:12px system-ui;color:#cceeff}.navhud b{color:#fff}.navhud button{background:#102633;color:#bfeaff;border:1px solid #31576c;border-radius:6px;padding:6px;margin:3px}.navhud .good{color:#75f0b2}@media(max-width:700px){.navhud{top:auto;bottom:8px;right:8px;left:8px;width:auto;max-height:30vh;overflow:auto}}</style></head><body><div class='navhud'><b>NAV / COMMS / FORECAST</b><div id='twinStatus' class='good'>Twin: connecting…</div><div id='renderStatus'>Renderer: starting…</div><div id='selection'>Tap a spacecraft/node to inspect</div><div><button id='resetCam'>RESET VIEW</button><button id='toggleRoutes'>ROUTES</button><button id='toggleLinks'>COMMS</button><button id='toggleForecast'>FORECAST</button></div></div><div id="hud"><b>NAVSTAR 3D DIGITAL TWIN</b><br>Earth · boundaries · field lines · particles · spacecraft · uncertainty<br>Drag: orbit · pinch/wheel: zoom · Sun → solar wind</div><canvas id="c"></canvas><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const r=new THREE.WebGLRenderer({canvas:document.querySelector('#c'),antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));
const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,2,.1,1000);cam.position.set(0,8,25);const ctl=new OrbitControls(cam,r.domElement);ctl.enableDamping=true;
s.add(new THREE.AmbientLight(0x7799bb,1.2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(20,3,5);s.add(sun);
const earth=new THREE.Mesh(new THREE.SphereGeometry(3,64,32),new THREE.MeshStandardMaterial({color:0x1767a8,roughness:.62,metalness:.05}));s.add(earth);
const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(3.08,64,32),new THREE.MeshBasicMaterial({color:0x4ca8ff,transparent:true,opacity:.10,side:THREE.BackSide}));s.add(atmosphere);
const grid=new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(3.02,24,12)),new THREE.LineBasicMaterial({color:0x7bc9ff,transparent:true,opacity:.08}));s.add(grid);
const sunBall=new THREE.Mesh(new THREE.SphereGeometry(.55,24,16),new THREE.MeshBasicMaterial({color:0xffd66b}));sunBall.position.set(20,3,5);s.add(sunBall);
for(const scale of [[10,6,6],[14,8,8]]){let g=new THREE.SphereGeometry(1,40,20),m=new THREE.MeshBasicMaterial({color:0x43d8ff,wireframe:true,transparent:true,opacity:.10}),o=new THREE.Mesh(g,m);o.scale.set(...scale);o.position.x=-2;s.add(o)}
const tail=new THREE.Mesh(new THREE.CylinderGeometry(5.8,2.4,25,32,1,true),new THREE.MeshBasicMaterial({color:0x2bd7ff,wireframe:true,transparent:true,opacity:.08}));tail.rotation.z=Math.PI/2;tail.position.x=-13;s.add(tail);
for(let i=0;i<55;i++){const mat=new THREE.LineBasicMaterial({color:0x64dfff,transparent:true,opacity:.12});const y=(Math.random()-.5)*12,z=(Math.random()-.5)*12;const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(22,y,z),new THREE.Vector3(8,y*.45,z*.45)]),mat);s.add(line)}
for(let i=0;i<18;i++){let curve=new THREE.EllipseCurve(0,0,4+i*.22,7+i*.15,0,Math.PI*2);let pts=curve.getPoints(90).map(p=>new THREE.Vector3(p.x,0,p.y));let line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x48efae,transparent:true,opacity:.25}));line.rotation.x=Math.PI/2;line.rotation.z=i*.31;s.add(line)}
const pg=new THREE.BufferGeometry(),pa=[];for(let i=0;i<900;i++)pa.push((Math.random()-.5)*36,(Math.random()-.5)*20,(Math.random()-.5)*20);pg.setAttribute('position',new THREE.Float32BufferAttribute(pa,3));s.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xa9ffd9,size:.035,transparent:true,opacity:.65})));
for(let i=0;i<12;i++){let n=new THREE.Mesh(new THREE.SphereGeometry(.12,12,8),new THREE.MeshBasicMaterial({color:0xfff1a8}));n.position.set((Math.random()-.5)*16,(Math.random()-.5)*9,(Math.random()-.5)*9);s.add(n)}
let boundaryObjects=s.children.filter(o=>o.type==="Mesh"&&o.material&&o.material.wireframe&&o.geometry&&o.geometry.type==="SphereGeometry");
const spacecraftNodes=s.children.filter(o=>o.type==="Mesh"&&o.geometry&&o.geometry.type==="SphereGeometry"&&o.geometry.parameters?.radius===.12);
function applyTwin(snapshot){
 const data=snapshot?.data||snapshot; const b=data?.boundaries||[];
 const mp=b.find(x=>x.boundary_type==="MAGNETOPAUSE"), bs=b.find(x=>x.boundary_type==="BOW_SHOCK");
 if(mp&&boundaryObjects[0]){const q=mp.standoff_re/10;boundaryObjects[0].scale.set(10*q,6*q,6*q)}
 if(bs&&boundaryObjects[1]){const q=bs.standoff_re/14.5;boundaryObjects[1].scale.set(14*q,8*q,8*q)}
 const craft=Object.values(data?.spacecraft||{});
 craft.slice(0,spacecraftNodes.length).forEach((x,i)=>{const p=x.position_re||x.position||x.position_gse_re;if(p)spacecraftNodes[i].position.set(p.x||0,p.y||0,p.z||0)});
}
async function syncTwin(){try{const x=await fetch('/api/v1/twin/snapshot',{cache:'no-store'});if(!x.ok)throw new Error('HTTP '+x.status);applyTwin(await x.json())}catch(e){document.getElementById('twinStatus').textContent='Twin: reconnecting • '+e.message}}
syncTwin();setInterval(syncTwin,5000);
try{const proto=location.protocol==="https:"?"wss":"ws";const ws=new WebSocket(proto+"://"+location.host+"/api/v1/twin/stream");ws.onmessage=e=>{try{applyTwin(JSON.parse(e.data))}catch(_){}}}catch(e){}
const routeGroup=new THREE.Group(),linkGroup=new THREE.Group(),forecastGroup=new THREE.Group();s.add(routeGroup,linkGroup,forecastGroup);
function line(group,a,b,color,opacity=.7){const o=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color,transparent:true,opacity}));group.add(o);return o}
function redrawOperational(data){
 routeGroup.clear();linkGroup.clear();forecastGroup.clear();
 const craft=Object.values(data?.spacecraft||{}).slice(0,12);
 craft.forEach((x,i)=>{const p=x.position_re||x.position||x.position_gse_re;if(!p)return;const a=new THREE.Vector3(p.x||0,p.y||0,p.z||0);const future=a.clone().add(new THREE.Vector3(1.5,.35*(i%3-1),.2));line(routeGroup,a,future,0x55ddff,.8);const ghost=new THREE.Mesh(new THREE.SphereGeometry(.18,12,8),new THREE.MeshBasicMaterial({color:0xffcc66,transparent:true,opacity:.28}));ghost.position.copy(future);forecastGroup.add(ghost)});
 for(let i=1;i<craft.length;i++){let a=craft[i-1].position_re||craft[i-1].position,b=craft[i].position_re||craft[i].position;if(a&&b)line(linkGroup,new THREE.Vector3(a.x||0,a.y||0,a.z||0),new THREE.Vector3(b.x||0,b.y||0,b.z||0),0x6dff9a,.35)}
}
const oldApplyTwin=applyTwin;applyTwin=function(snapshot){oldApplyTwin(snapshot);const data=snapshot?.data||snapshot;redrawOperational(data);document.getElementById("twinStatus").textContent="Twin: LIVE • "+new Date().toLocaleTimeString()};
document.getElementById("resetCam").onclick=()=>{cam.position.set(0,8,28);ctl.target.set(0,0,0);ctl.update()};
document.getElementById("toggleRoutes").onclick=()=>routeGroup.visible=!routeGroup.visible;
document.getElementById("toggleLinks").onclick=()=>linkGroup.visible=!linkGroup.visible;
document.getElementById("toggleForecast").onclick=()=>forecastGroup.visible=!forecastGroup.visible;
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();r.domElement.addEventListener("pointerdown",ev=>{pointer.x=ev.clientX/innerWidth*2-1;pointer.y=-(ev.clientY/innerHeight)*2+1;ray.setFromCamera(pointer,cam);const hits=ray.intersectObjects(spacecraftNodes);if(hits.length){const o=hits[0].object;document.getElementById("selection").textContent="Selected node • x "+o.position.x.toFixed(2)+" • y "+o.position.y.toFixed(2)+" • z "+o.position.z.toFixed(2)+" Re"}});
const clock=new THREE.Clock();
function draw(){let w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();ctl.update();const t=clock.getElapsedTime();earth.rotation.y+=.0008;atmosphere.rotation.y=earth.rotation.y;grid.rotation.y=earth.rotation.y;sunBall.scale.setScalar(1+.05*Math.sin(t*2));r.render(s,cam);requestAnimationFrame(draw)}draw();
</script></body></html>
